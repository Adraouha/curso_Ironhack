<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chatbot Eliza</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <header>
      <strong>Eliza - Chatbot Psicologa</strong>
      <button id="reset">Nueva conversacion</button>
    </header>
    <div id="chat"></div>
    <div id="form">
      <input id="input" type="text" placeholder="Escribe aqui tu mensaje..." autocomplete="off">
      <button id="send">Enviar</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
